name: Build Desktop App

on:
  push:
    branches: [trunk]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_path: target/release/bundle/osx/Aella.app
            artifact_name: Aella-macOS.app.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_path: target/release/bundle/msi/*.msi
            artifact_name: Aella-Windows.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build bundle
        run: cargo bundle -p aella-desktop --release

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd target/release/bundle/osx
          tar -czf ../../../../${{ matrix.artifact_name }} Aella.app

      - name: Find Windows MSI
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          MSI_PATH=$(find target/release/bundle/msi -name "*.msi" -type f | head -n 1)
          echo "MSI_PATH=$MSI_PATH" >> $GITHUB_ENV
          cp "$MSI_PATH" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 30
