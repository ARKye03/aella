[workspace]
members = ["aella-core", "aella-desktop", "aella-cli"]
resolver = "2"

[workspace.dependencies]
harper-core = "1.6.0"
iced = { version = "0.14.0", features = [
    "tokio",
    "canvas",
    "markdown",
    "svg",
    "highlighter",
    "image",
] }
tokio = { version = "1.49.0", features = ["full"] }
turso = "0.4.4"
dirs = "6.0.0"
